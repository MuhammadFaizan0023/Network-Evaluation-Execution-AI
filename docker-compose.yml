version: "3.8"

services:
  dvwa:
    build: .
    container_name: dvwa-web
    ports:
      - "127.0.0.1:8080:80"
    environment:
      - DEFAULT_SECURITY_LEVEL=low
    depends_on:
      - db
    networks:
      nexa-net:
        ipv4_address: 172.20.0.10

  db:
    image: mariadb:10.11
    container_name: dvwa-db
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: dvwa
    networks:
      nexa-net:
        ipv4_address: 172.20.0.11

  sniffer:
    image: nicolaka/netshoot
    container_name: traffic-sniffer
    network_mode: "host"
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - ./pcaps:/pcaps
    command: >
      sh -c "
      BRIDGE_DEV=\$$(ip route show 172.20.0.0/16 2>/dev/null | awk '{print \$$3}');
      echo \"Detected nexa-net bridge: \$$BRIDGE_DEV\";
      if [ -n \"\$$BRIDGE_DEV\" ]; then
        tcpdump -i \$$BRIDGE_DEV 'not host 168.63.129.16 and not host 127.0.0.1 and not host 172.20.0.50 and not host 172.20.0.201 and not port 22 and not port 29092 and not port 9092 and not port 9093 and not port 8000 and not port 3000 and not port 3306' -w /pcaps/traffic_br_%Y%m%d_%H%M%S.pcap -G 15 &
      fi;
      tcpdump -i eth0 'not host 168.63.129.16 and not host 127.0.0.1 and not host 172.20.0.50 and not host 172.20.0.201 and not port 22 and not port 29092 and not port 9092 and not port 9093 and not port 8000 and not port 3000 and not port 3306' -w /pcaps/traffic_eth0_%Y%m%d_%H%M%S.pcap -G 15
      "

  client1:
    image: curlimages/curl:latest
    container_name: client1
    networks:
      nexa-net:
        ipv4_address: 172.20.0.101
    depends_on:
      - dvwa
    command: >
      sh -c "
      echo 'Client 1 starting...';
      while true; do
        curl -s http://172.20.0.10/dvwa/ > /dev/null;
        sleep $$((RANDOM % 8 + 3));
        curl -s http://172.20.0.10/dvwa/about.php > /dev/null;
        sleep $$((RANDOM % 12 + 5));
        curl -s http://172.20.0.10/dvwa/instructions.php > /dev/null;
        sleep $$((RANDOM % 6 + 2));
        curl -s http://172.20.0.10/dvwa/setup.php > /dev/null;
        sleep $$((RANDOM % 15 + 8));
        curl -s http://172.20.0.10/dvwa/phpinfo.php > /dev/null;
        sleep $$((RANDOM % 10 + 4));
      done
      "

  client2:
    image: curlimages/curl:latest
    container_name: client2
    networks:
      nexa-net:
        ipv4_address: 172.20.0.102
    depends_on:
      - dvwa
    command: >
      sh -c "
      echo 'Client 2 starting...';
      sleep 7;
      while true; do
        curl -s http://172.20.0.10/dvwa/security.php > /dev/null;
        sleep $$((RANDOM % 20 + 10));
        curl -s http://172.20.0.10/dvwa/about.php > /dev/null;
        sleep $$((RANDOM % 25 + 15));
        curl -s http://172.20.0.10/dvwa/ > /dev/null;
        sleep $$((RANDOM % 10 + 5));
        curl -s http://172.20.0.10/dvwa/instructions.php > /dev/null;
        sleep $$((RANDOM % 30 + 10));
        curl -s http://172.20.0.10/dvwa/phpinfo.php > /dev/null;
        sleep $$((RANDOM % 18 + 8));
      done
      "

  client3:
    image: curlimages/curl:latest
    container_name: client3
    networks:
      nexa-net:
        ipv4_address: 172.20.0.103
    depends_on:
      - dvwa
    command: >
      sh -c "
      echo 'Client 3 starting...';
      sleep 13;
      while true; do
        curl -s http://172.20.0.10/dvwa/phpinfo.php > /dev/null;
        sleep $$((RANDOM % 35 + 20));
        curl -s http://172.20.0.10/dvwa/ > /dev/null;
        sleep $$((RANDOM % 12 + 6));
        curl -s http://172.20.0.10/dvwa/about.php > /dev/null;
        sleep $$((RANDOM % 18 + 8));
        curl -s http://172.20.0.10/dvwa/setup.php > /dev/null;
        sleep $$((RANDOM % 40 + 20));
        curl -s http://172.20.0.10/dvwa/instructions.php > /dev/null;
        sleep $$((RANDOM % 15 + 5));
      done
      "

  cicflow:
    build: ./cicflowmeter
    container_name: cicflowmeter
    volumes:
      - ./pcaps:/pcaps:ro
      - ./pcaps_iot:/pcaps_iot:ro
      - ./flows:/flows
      - ./process_pcaps.sh:/app/process_pcaps.sh:ro
      - ./flows_iot:/flows_iot
      # Isolated IoT test lane (does not feed the live kafka-producer)
      - ./pcaps_iot_test:/pcaps_iot_test:ro
      - ./flows_iot_test:/flows_iot_test
    working_dir: /app
    entrypoint: ["/bin/sh"]
    command:
      [
        "-c",
        "cp /app/process_pcaps.sh /tmp/run.sh && sed -i 's/\\r$//' /tmp/run.sh && /bin/sh /tmp/run.sh",
      ]

    depends_on:
      - sniffer
    networks:
      - nexa-net

  kafka:
    image: confluentinc/cp-kafka:7.8.0
    container_name: kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
      KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093,PLAINTEXT_HOST://0.0.0.0:9092"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "127.0.0.1:9092:9092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - nexa-net
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "kafka-broker-api-versions --bootstrap-server localhost:9092 || exit 1",
        ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 40s

  kafka-producer:
    build: ./kafka_producer
    container_name: kafka-producer
    environment:
      KAFKA_BROKER: kafka:29092
      KAFKA_TOPIC: flows
      KAFKA_IOT_TOPIC: flows_iot
      KAFKA_TEST_TOPIC: flows_iot_test
      FLOWS_DIR: /flows
      FLOWS_IOT_DIR: /flows_iot
      FLOWS_TEST_DIR: /flows_iot_test
      BATCH_SIZE: 5
      SCAN_INTERVAL: 2
    volumes:
      - ./flows:/flows:ro
      - ./flows_iot:/flows_iot:ro
      - ./flows_iot_test:/flows_iot_test:ro
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - nexa-net
    restart: unless-stopped

  ml-consumer:
    build: ./ml_consumer
    container_name: ml-consumer
    environment:
      - KAFKA_BROKER=kafka:29092
      - KAFKA_TOPIC=flows
      - CONFIDENCE_THRESHOLD=0.80
      - BACKEND_URL=${NEXA_BACKEND_URL:-http://host.docker.internal:8000}
      - SOURCE_TYPE=website
      - REGISTERED_ID=1
      - HEALTH_INTERVAL=60
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./ml_consumer/model:/app/model:ro
      - ./ml_consumer/consumer.py:/app/consumer.py:ro
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - nexa-net
    restart: unless-stopped

  # ── IoT ML Consumer ──────────────────────────────────────────────────────────
  # Handles home_network traffic using XGBoost TON-IoT model
  # Activated when Raspberry Pi / Jetson sends flows to flows_iot topic
  ml-consumer-iot:
    build: ./ml_consumer
    container_name: ml-consumer-iot
    environment:
      - KAFKA_BROKER=kafka:29092
      - KAFKA_TOPIC=flows_iot
      - CONFIDENCE_THRESHOLD=0.80
      - BACKEND_URL=${NEXA_BACKEND_URL:-http://host.docker.internal:8000}
      - SOURCE_TYPE=home_network
      - REGISTERED_ID=1
      - HEALTH_INTERVAL=60
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./ml_consumer/model:/app/model:ro
      - ./ml_consumer/consumer.py:/app/consumer.py:ro
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - nexa-net
    restart: unless-stopped

  # ── IoT ML Consumer (Test Lane) ───────────────────────────────────────────
  # Runs the TON-IoT model on the ISOLATED simulation test lane (flows_iot_test).
  # Keeps the Simulation Lab's home-network scenarios off the real device lane.
  ml-consumer-iot-test:
    build: ./ml_consumer
    container_name: ml-consumer-iot-test
    environment:
      - KAFKA_BROKER=kafka:29092
      - KAFKA_TOPIC=flows_iot_test
      - CONFIDENCE_THRESHOLD=0.80
      - BACKEND_URL=${NEXA_BACKEND_URL:-http://host.docker.internal:8000}
      # iot_test keeps simulation results out of the real home_network dashboard
      # while still using the IoT model (consumer picks it whenever != website).
      - SOURCE_TYPE=iot_test
      - REGISTERED_ID=1
      - HEALTH_INTERVAL=60
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./ml_consumer/model:/app/model:ro
      - ./ml_consumer/consumer.py:/app/consumer.py:ro
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - nexa-net
    restart: unless-stopped

  kali-attacker:
    build: ./kali_attacker
    container_name: kali-attacker
    networks:
      nexa-net:
        ipv4_address: 172.20.0.200
    depends_on:
      - dvwa
    volumes:
      - ./kali_attacks:/attacks
    command: tail -f /dev/null

  # ── IoT Attacker ──────────────────────────────────────────────────────────
  # Dedicated attacker box for home-network scenarios (runs iot_attacks/*.sh via
  # docker exec). Kept separate from kali-attacker, which is web-only.
  iot-attacker:
    build: ./iot_attacker
    container_name: iot-attacker
    networks:
      nexa-net:
        ipv4_address: 172.20.0.201
    depends_on:
      - iot-victim
    volumes:
      - ./iot_attacks:/iot_attacks
    command: tail -f /dev/null
    restart: unless-stopped

  # ── IoT Victim Device ─────────────────────────────────────────────────────
  # Simulated IoT device target. Self-captures its own traffic into the ISOLATED
  # ./pcaps_iot_test folder (processed by cicflow, never feeds the live pipeline).
  iot-victim:
    build: ./iot_victim
    container_name: iot-victim
    networks:
      nexa-net:
        ipv4_address: 172.20.0.50
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - ./pcaps_iot_test:/pcaps_iot_test
    restart: unless-stopped

  nexa-frontend:
    build: ./nexa_frontend
    container_name: nexa-frontend
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - NEXT_PUBLIC_API_BASE_URL=${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000/api}
      - NEXT_PUBLIC_WS_BASE_URL=${NEXT_PUBLIC_WS_BASE_URL:-ws://localhost:8000/ws/dashboard/}
    networks:
      - nexa-net
    restart: unless-stopped

networks:
  nexa-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  kafka_data:
    driver: local
